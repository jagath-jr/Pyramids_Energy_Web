<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body>
  <div id="loginView" class="centered-card">
    <h1>Admin Login</h1>
    <p>Use your admin credentials to access content controls.</p>
    <form id="loginForm">
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>
    <p id="loginError" class="error"></p>
  </div>

  <div id="dashboardView" class="hidden">
    <header>
      <h1>Content Admin Dashboard</h1>
      <div class="header-actions">
        <button id="restoreDefaults">Restore Defaults</button>
        <button id="undoBtn">Undo Last Change</button>
        <button id="saveBtn" class="primary">Save Changes</button>
        <button id="logoutBtn">Logout</button>
      </div>
    </header>

    <section class="cards" id="navCards"></section>
    <section id="editorPanel"></section>
  </div>

  <template id="sectionTemplate">
    <div class="section-block">
      <h2></h2>
      <div class="fields"></div>
    </div>
  </template>

  <script src="/admin/app.js"></script>
</body>
</html>
