<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Careers - Pyramids Energy</title>
  <link rel="icon" type="image/x-icon" href="assets/images/ui/header-logo.png">
  
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/common.css" />
  <link rel="stylesheet" href="assets/css/careers.css" />
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="career-main">
    
    <section class="career-hero">
      <div class="career-container">
        <h1 class="career-hero__title" id="page-title">Loading...</h1>
        <p class="career-hero__desc" id="page-desc"></p>
      </div>
    </section>

    <section class="career-listings" aria-labelledby="jobs-heading">
      <div class="career-container">
        <h2 id="jobs-heading" class="career-visually-hidden">Current Openings</h2>
        <div class="career-grid" id="job-container">
          </div>
      </div>
    </section>

    <section class="career-contact">
      <div class="career-container career-contact__grid">
        
        <div class="career-contact__section">
    <h2 class="career-contact__heading">Why Work With Us ?</h2>
    <ul class="career-contact__list">
      <li class="career-contact__list-item">Diverse, Multinational Work Environment</li>
      <li class="career-contact__list-item">Continuous Training & Certification</li>
      <li class="career-contact__list-item">Career Growth in Large-Scale Utility Projects</li>
    </ul>
  </div>

        <div class="career-contact__form-wrapper">
          <form class="career-form" id="application-form">
            <h3 class="career-form__title">Fill Out the form</h3>
            
            <div class="career-form__row">
              <div class="career-form__group">
                <input type="text" id="name" name="name" class="career-form__input" placeholder="Name" required>
              </div>
              <div class="career-form__group">
                <input type="tel" id="phone" name="phone" class="career-form__input" placeholder="Phone No" required>
              </div>
            </div>

            <div class="career-form__row">
              <div class="career-form__group">
                <input type="email" id="email" name="email" class="career-form__input" placeholder="Email" required>
              </div>
              <div class="career-form__group">
                <select id="position" name="position" class="career-form__input career-form__select" required>
                  <option value="" disabled selected>Position</option>
                  </select>
              </div>
            </div>

            <div class="career-form__group">
              <label for="cv" class="career-form__file-label">
                <span class="career-form__file-text">Upload CV / Resume</span>
                <input type="file" id="cv" name="cv" class="career-form__file-input" accept=".pdf,.doc,.docx">
              </label>
            </div>

            <div class="career-form__group">
              <textarea id="message" name="message" class="career-form__input career-form__textarea" placeholder="Your Message" rows="4"></textarea>
            </div>

            <button type="submit" class="career-form__submit">Submit</button>
          </form>
        </div>

      </div>
    </section>

  </main>
  <div id="common-footer"></div>

  
  <script src="assets/js/common.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="assets/js/careers-email.js"></script> 

  <script>
    AOS.init({ duration: 1000, once: true });

    document.addEventListener("DOMContentLoaded", () => {
      gsap.registerPlugin(ScrollTrigger);

      const jsonUrl = 'data/careers.json'; 
      const container = document.getElementById('job-container');
      const titleEl = document.getElementById('page-title');
      const descEl = document.getElementById('page-desc');
      const benefitsContainer = document.getElementById('benefits-list'); 
      const positionSelect = document.getElementById('position');

      // --- 1. Fetch Data ---
      fetch(jsonUrl)
        .then(response => {
          if (!response.ok) throw new Error("Failed to load career data");
          return response.json();
        })
        .then(data => {
          // A. Populate Hero
          titleEl.textContent = data.pageContent.title;
          descEl.textContent = data.pageContent.description;

          // B. Get Unique Titles for List & Dropdown
          const allTitles = data.jobs.map(job => job.title);
          const uniqueTitles = [...new Set(allTitles)];

          // Populate Left List
          if (benefitsContainer) {
            benefitsContainer.innerHTML = ''; 
            uniqueTitles.forEach(title => {
              const li = document.createElement('li');
              li.classList.add('career-contact__list-item');
              li.textContent = title; 
              benefitsContainer.appendChild(li);
            });
          }

          // Populate Right Form Dropdown
          if(positionSelect) {
            positionSelect.innerHTML = '<option value="" disabled selected>Position</option>';
            uniqueTitles.forEach(title => {
              const option = document.createElement('option');
              option.value = title;
              option.textContent = title;
              positionSelect.appendChild(option);
            });
          }

          // C. Generate Job Cards
          data.jobs.forEach(job => {
            const article = document.createElement('article');
            article.classList.add('career-card');
            
            const listItems = job.responsibilities
              .map(item => `<li class="career-card__list-item">${item}</li>`)
              .join('');

            article.innerHTML = `
              <div class="career-card__header">
                <div>
                  <h3 class="career-card__title">${job.title}</h3>
                  <div class="career-card__location">
                    <svg class="career-card__icon" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                      <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
                    </svg>
                    ${job.location}
                  </div>
                </div>
                <span class="career-card__tag">${job.type}</span>
              </div>
              <ul class="career-card__list">
                ${listItems}
              </ul>
            `;
            container.appendChild(article);
          });

          // D. Start Animations
          initAnimations();
        })
        .catch(error => {
          console.error('Error:', error);
          container.innerHTML = '<p>Unable to load job listings at this time.</p>';
        });

      // --- GSAP Animations ---
      function initAnimations() {
        // Hero Text
        gsap.from(".career-hero > div", {
          duration: 1, y: 50, opacity: 0, ease: "power3.out", delay: 0.2
        });

        // Job Cards
        const cards = document.querySelectorAll('.career-card');
        ScrollTrigger.batch(cards, {
          onEnter: batch => gsap.to(batch, {
            opacity: 1, y: 0, stagger: 0.15, duration: 0.8, ease: "power3.out", overwrite: true
          }),
          start: "top 85%", once: true
        });

        // Contact Section Animation
        gsap.from(".career-contact__content", {
          scrollTrigger: { trigger: ".career-contact", start: "top 80%" },
          x: -50, opacity: 0, duration: 1, ease: "power3.out"
        });

        gsap.to(".career-contact__form-wrapper", {
          scrollTrigger: { trigger: ".career-contact", start: "top 80%" },
          x: 0, opacity: 1, duration: 1, delay: 0.2, ease: "power3.out"
        });
      }
    });
  </script>
</body>
</html>
