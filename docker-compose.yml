version: '3.9'
services:
  pyramids-web:
    build: .
    container_name: pyramids-energy-web
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
